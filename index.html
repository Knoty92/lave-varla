<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ľavé Varla — Landing Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5e6d3;
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
    }

    .title {
      font-size: 2rem;
      color: #8b4513;
      margin-bottom: 0.5rem;
      animation: fadeIn 1s ease-in;
    }

    .subtitle {
      font-size: 1rem;
      color: #a0724a;
      font-style: italic;
      margin-bottom: 2rem;
      animation: fadeIn 1.5s ease-in;
    }

    .canvas-wrapper {
      position: relative;
      width: 320px;
      height: 400px;
      margin: 0 auto;
    }

    /* Body outline */
    .body-outline {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 280px;
      border: 3px solid #c4956a;
      border-radius: 70px 70px 0 0;
      opacity: 0.4;
    }

    /* Abdominal cavity */
    .cavity {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 40px;
      background: radial-gradient(ellipse, #2a1a0a 0%, #0d0803 100%);
      border-radius: 50%;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 20px rgba(139,69,19,0.3);
      z-index: 5;
    }

    .cavity-label {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: #8b4513;
      letter-spacing: 0.1em;
      white-space: nowrap;
      opacity: 0.7;
    }

    /* Left testicle */
    .varla {
      position: absolute;
      bottom: 20px;
      left: 75px;
      width: 45px;
      height: 35px;
      background: radial-gradient(ellipse at 40% 30%, #f5c6a0, #c4865a 50%, #8b4513 100%);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(139,69,19,0.4), inset 0 -3px 8px rgba(0,0,0,0.2);
      z-index: 10;
      animation: retract 4s ease-in-out infinite;
    }

    .varla::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 10px;
      width: 12px;
      height: 8px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
    }

    /* Right testicle — stationary for contrast */
    .varla-right {
      position: absolute;
      bottom: 18px;
      right: 75px;
      width: 42px;
      height: 33px;
      background: radial-gradient(ellipse at 55% 30%, #f5c6a0, #c4865a 50%, #8b4513 100%);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(139,69,19,0.4), inset 0 -3px 8px rgba(0,0,0,0.2);
      z-index: 10;
      transition: opacity 0.3s;
    }

    .varla-right::before {
      content: '';
      position: absolute;
      top: 3px;
      right: 10px;
      width: 11px;
      height: 7px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
    }

    @keyframes retract {
      0%, 10% {
        bottom: 20px;
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
      25% {
        bottom: 45px;
        opacity: 0.9;
        transform: scale(0.85) rotate(-15deg);
      }
      40% {
        bottom: 70px;
        opacity: 0.4;
        transform: scale(0.5) rotate(-30deg);
      }
      50% {
        bottom: 80px;
        opacity: 0;
        transform: scale(0.2) rotate(-45deg);
      }
      55%, 80% {
        bottom: 80px;
        opacity: 0;
        transform: scale(0.2) rotate(-45deg);
      }
      90% {
        bottom: 35px;
        opacity: 0.6;
        transform: scale(0.8) rotate(-10deg);
      }
      100% {
        bottom: 20px;
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-text {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #8b4513;
      opacity: 0.8;
      animation: fadeIn 2s ease-in;
    }

    .status-text span {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .button {
      margin-top: 1.5rem;
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: #8b4513;
      color: #f5e6d3;
      border: none;
      border-radius: 25px;
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      text-decoration: none;
      animation: fadeIn 2.5s ease-in;
    }

    .button:hover {
      background: #a0522d;
      transform: scale(1.05);
    }

    .button:active {
      transform: scale(0.95);
    }

    .wiggle-line {
      position: absolute;
      bottom: 55px;
      left: 97px;
      width: 2px;
      height: 25px;
      background: linear-gradient(to top, rgba(139,69,19,0.6), transparent);
      opacity: 0;
      animation: traceVisible 4s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes traceVisible {
      0%, 15% { opacity: 0; }
      25%, 45% { opacity: 0.7; }
      50%, 100% { opacity: 0; }
    }

    .scientific-note {
      margin-top: 2rem;
      font-size: 0.55rem;
      color: #c4956a;
      font-style: italic;
      animation: fadeIn 3s ease-in;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Ľavé Varla</h1>
    <p class="subtitle">Retrakcia do brušnej dutiny</p>

    <div class="canvas-wrapper">
      <div class="body-outline"></div>

      <div class="cavity">
        <div class="cavity-label">brušná dutina</div>
      </div>

      <div class="wiggle-line"></div>

      <div class="varla"></div>
      <div class="varla-right"></div>
    </div>

    <p class="status-text">Ľavé varla sa schováva<span>...</span></p>

    <p class="scientific-note">
      Anatomicky presná simulácia retrakčného mechanizmu &copy; Molestermatej Laboratories
    </p>
  </div>
</body>
</html>
